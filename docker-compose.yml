# Two ways to run this, because Apple Silicon and Linux are genuinely different.
#
#   docker compose up                     api + redis + postgres.
#                                         Ollama runs on the host — containers on macOS
#                                         have no Metal access, so an Ollama container
#                                         falls back to CPU and feels broken (ADR-0010).
#
#   docker compose --profile bundled up   adds Ollama in a container, for Linux hosts
#                                         with a GPU. One command, nothing on the host.

services:
  api:
    build:
      context: ./services/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://weather:${POSTGRES_PASSWORD:-weather}@postgres:5432/weather
      REDIS_URL: redis://redis:6379/0
      # host.docker.internal reaches the host's Ollama on macOS and Windows. The bundled
      # profile needs http://ollama:11434 instead, and compose cannot vary one service's
      # environment by profile — this comment used to claim it was overridden and nothing
      # did, so `--profile bundled` started an Ollama container and then ignored it.
      # `install.sh` writes the right value into .env; set it by hand if you run compose
      # directly.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — the service will not start without one}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: weather
      # Defaulted so an existing volume keeps working; `install.sh` generates one for a
      # fresh server, where a published port and a password of "weather" is not a pair.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weather}
      POSTGRES_DB: weather
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather -d weather"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ollama:
    profiles: ["bundled"]
    image: ollama/ollama:latest
    # Bound to loopback. The bundled profile exists so the model does not have to be
    # installed on the host, not so it can be reached from off the machine — an open
    # 11434 is an unauthenticated inference endpoint.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  ollama-models:
