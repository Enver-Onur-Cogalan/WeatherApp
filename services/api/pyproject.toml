[project]
name = "weatherapp-api"
version = "0.1.0"
description = "WeatherApp service: forecast, scoring engine, and the local planning agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # 'email' extra: EmailStr on the auth endpoints needs email-validator, and Pydantic
    # raises at import time rather than at validation time when it is missing.
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "redis>=5.2",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    # SQLAlchemy's async layer bridges to its sync internals through greenlets. It is a
    # transitive dependency in practice but not a declared one, and its absence surfaces
    # only when a connection is actually opened — well past import, install and lint.
    "greenlet>=3.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pyyaml>=6.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 96
target-version = "py311"
# `app/schemas` is generated from packages/schema; its line lengths come from schema
# descriptions, which should not be truncated to satisfy a linter. `alembic/versions` is
# applied history — a migration that has run everywhere should not be rewritten to change
# a quote style, and Alembic's template is Alembic's to own.
extend-exclude = ["app/schemas", "alembic/versions"]

# Without this an exclusion is ignored for any path named explicitly on the command line,
# which is exactly what an editor's format-on-save does. That gap is why the generated
# Pydantic ended up reformatted in the repository while the generator kept emitting the
# unformatted form, and the schema CI job failed on a diff that had nothing to do with
# any schema.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001-003 flag non-ASCII characters that resemble ASCII ones — a homoglyph check.
# This app's interface is Turkish and English as equals (CLAUDE.md), and Turkish needs
# ı, ş, ğ, ç, ö, ü in ordinary user-facing copy. Here the rule fires on correct text,
# so it would train us to write the language wrong.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
